name: Fetch Yahoo pre-market pulse (5 min)

# Why this loops instead of using a */5 cron (changed 23 Nov 2026):
# GitHub's scheduler throttled the old */5 cron to ~2 runs a day and skipped Monday
# 23 Nov entirely, so the page scored Friday's -3% crash as "strong bear 1" on an up day.
# Now ONE run stays alive and fetches every 5 min by itself, for up to ~5h50m or until
# 22:00 UTC. Hourly triggers are only kick-starts: while a loop is running, the next
# trigger waits in the queue (one pending max) and takes over when the loop ends,
# so a few missed triggers no longer leave gaps.
# For guaranteed starts, point cron-job.org at workflow_dispatch hourly (like the other dashboards).

on:
  schedule:
    - cron: '0 8-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every 5 min until 22:00 UTC (max ~5h50m per run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          now=$(date -u +%s)
          deadline=$((now + 350 * 60))
          stop=$(date -u -d "$(date -u +%F) 22:00" +%s)
          [ "$stop" -lt "$deadline" ] && deadline=$stop
          dow=$(date -u +%u)
          if [ "$dow" -gt 5 ] || [ "$now" -ge "$stop" ]; then
            echo "Outside 08:00-22:00 UTC Mon-Fri - single fetch only"
            deadline=$((now + 1))
          fi
          while :; do
            git pull --rebase --quiet origin main || true
            python3 scripts/pulse.py || echo "pulse.py failed this round"
            git add data/pulse.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Pulse update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
              for i in 1 2 3; do
                git push -q && break
                sleep 5
                git pull --rebase --quiet origin main
              done
            fi
            next=$(( $(date -u +%s) + 300 ))
            [ "$next" -ge "$deadline" ] && break
            sleep 300
          done
