name: Fetch Yahoo pre-market pulse (5 min)

# Why this loops instead of using a */5 cron (changed 23 Nov 2026):
# GitHub's scheduler throttled the old */5 cron to ~2 runs a day and skipped Monday
# 23 Nov entirely, so the page scored Friday's -3% crash as "strong bear 1" on an up day.
# Now ONE run stays alive and fetches every 5 min by itself, for up to ~5h50m or until
# 22:00 UTC. Hourly triggers are only kick-starts: while a loop is running, the next
# trigger waits in the queue (one pending max) and takes over when the loop ends.
#
# Data goes to the `pulse-data` branch, NOT main (changed 23 Nov 2026): a commit to main
# every 5 min meant ~12 GitHub Pages rebuilds an hour, over Pages' soft limit of 10.
# The page reads it from raw.githubusercontent.com. The branch is kept to one commit
# (amend + force push), so it never grows.
# The loop also refreshes data/correction_watch.json (scripts/correction_watch.py) hourly,
# and data/breadth.json (scripts/breadth.py) every round in the first 4 trading hours.

on:
  schedule:
    - cron: '0 8-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every 5 min until 22:00 UTC (max ~5h50m per run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin pulse-data
          git worktree add -B pulse-data ../pd origin/pulse-data

          now=$(date -u +%s)
          deadline=$((now + 350 * 60))
          stop=$(date -u -d "$(date -u +%F) 22:00" +%s)
          [ "$stop" -lt "$deadline" ] && deadline=$stop
          dow=$(date -u +%u)
          if [ "$dow" -gt 5 ] || [ "$now" -ge "$stop" ]; then
            echo "Outside 08:00-22:00 UTC Mon-Fri - single fetch only"
            deadline=$((now + 1))
          fi

          round=0
          while :; do
            mkdir -p ../pd/data
            # Correction watch (daily closes): first round, then hourly. Completed sessions only.
            if [ $((round % 12)) -eq 0 ]; then
              python3 scripts/correction_watch.py && cp data/correction_watch.json ../pd/data/ || echo "correction_watch.py failed this round"
            fi
            round=$((round + 1))
            # Buy/sell volume proxy (24 Nov 2026, moved from v1's throttled */15 cron):
            # every round from 9:31am to 1:45pm New York time on weekdays.
            nyhm=$(TZ=America/New_York date +%H%M)
            if [ "$dow" -le 5 ] && [ "$nyhm" -ge 0931 ] && [ "$nyhm" -le 1345 ]; then
              python3 scripts/breadth.py && cp data/breadth.json ../pd/data/ || echo "breadth.py failed this round"
            fi
            # Gold + Bitcoin reference cards (24 Nov 2026, v1's twice-daily cron kept getting skipped): every 15 min.
            if [ $(( (round - 1) % 3 )) -eq 0 ]; then
              python3 scripts/refpoints.py || echo "refpoints.py failed this round"
              for f in gold bitcoin; do [ -f "data/$f.json" ] && cp "data/$f.json" ../pd/data/; done
            fi
            if python3 scripts/pulse.py; then
              cp data/pulse.json ../pd/data/pulse.json
              python3 scripts/snap8pm.py ../pd/data/pulse_8pm.json || echo "snap8pm.py failed this round"
              (
                cd ../pd
                git add data/pulse.json; for f in correction_watch breadth gold bitcoin pulse_8pm; do [ -f "data/$f.json" ] && git add "data/$f.json"; done; true
                if ! git diff --cached --quiet; then
                  git commit -q --amend -m "Pulse update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
                  git push -q --force origin pulse-data || echo "push failed this round"
                fi
              )
            else
              echo "pulse.py failed this round"
            fi
            next=$(( $(date -u +%s) + 300 ))
            [ "$next" -ge "$deadline" ] && break
            sleep 300
          done
