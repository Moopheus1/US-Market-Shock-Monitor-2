name: GEX size of today

on:
  schedule:
    # Hourly, 22:20-13:20 UTC (6:20am-9:20pm SGT). SqueezeMetrics posts each day's GEX
    # some time after the US close; checking hourly means the newest value is on the
    # page well before the 8pm SGT read, even if GitHub's scheduler skips a run.
    - cron: '20 0-13,22-23 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rank latest GEX and write expected move size
        run: python3 scripts/gex_size.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gex_size.json
          git diff --cached --quiet || git commit -m "GEX size update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done
